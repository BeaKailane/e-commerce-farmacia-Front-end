name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Validate API configuration
      run: |
        test -n "$VITE_API_URL" || { echo "VITE_API_URL não configurada"; exit 1; }
        echo "VITE_API_URL configurada"
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
    - name: Acordar backend no Render
      run: |
        for i in {1..15}; do
          status=$(curl -s -o /dev/null -w "%{http_code}" https://e-commerce-farmacia-f13f.onrender.com/v3/api-docs)
          if [ "$status" = "200" ]; then
            echo "Backend acordado!"
            break
          fi
          echo "Tentativa $i: backend ainda dormindo (status $status), aguardando..."
          sleep 5
        done
    - name: Run Playwright tests
      run: |
        echo "VITE_API_URL configurada: $VITE_API_URL"
        npx playwright test
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
